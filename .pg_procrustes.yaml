# In an SQL file, everything between the comments
#   -- pg_procrustes: off
#   -- pg_procrustes: on
# is left exactly as written (no closing "on": to the end of the file). See README → Leaving a part alone.
#
# Start from other config files (installed template name, or a file path relative to this one;
# your settings in this file win). See README → Templates.
#   template: ai
#   template: [postgresql, ../shared/team.yaml]

reserved_keywords:
  case: upper     # upper | lower | capitalize | preserve  (SELECT, FROM, WHERE, CREATE, TABLE, JOIN, ...)
  # exceptions:   # pin specific words to exact casing regardless of the case setting
  #   - MyWord    # applied to: reserved_keywords, keywords, data_types, literals, operators,
  #               #             schemas, tables, columns, functions, conditional_functions,
  #               #             system_functions, aliases, plpgsql_variables, plpgsql_keywords

keywords:
  case: upper     # upper | lower | capitalize | preserve  (ANALYZE, VERBOSE, CASCADE, ...)

data_types:
  case: lower     # upper | lower | capitalize | preserve
  form: long      # preserve | long | short | long_no_space
                  #   long:          character varying, double precision, timestamp with time zone
                  #   short:         varchar, float8, timestamptz
                  #   long_no_space: integer, bigint, varchar (no multi-word forms)

literals:
  case: upper     # upper | lower | capitalize | preserve  (TRUE, FALSE, NULL)

operators:
  case: upper     # upper | lower | capitalize | preserve  (AND, OR, NOT, IN, IS, LIKE, BETWEEN, ...)

schemas:
  case: lower     # upper | lower | capitalize | preserve

tables:
  case: lower     # upper | lower | capitalize | preserve

functions:
  case: lower     # upper | lower | capitalize | preserve  (now(), count(), my_func(), ...)
  # exceptions: [ST_AsText, ST_GeomFromText]

conditional_functions:
  case: upper     # upper | lower | capitalize | preserve  (COALESCE, NULLIF, GREATEST, LEAST)

system_functions:
  case: upper     # upper | lower | capitalize | preserve  (CURRENT_DATE, CURRENT_TIMESTAMP, SESSION_USER, ...)

builtin_functions:
  case: ""        # "" (same as functions) | upper | lower | capitalize | preserve
                  # PostgreSQL built-ins (count, sum, lower, date_trunc, ...); other functions follow `functions`
  # exceptions: [jsonb_set]

aliases:
  case: lower     # upper | lower | capitalize | preserve
  as: add         # add | preserve | remove

columns:
  case: lower     # upper | lower | capitalize | preserve
  # exceptions: [myID, anotherKey]

plpgsql_variables:
  case: upper     # upper | lower | capitalize | preserve
                  # NEW, OLD, EXCLUDED (ON CONFLICT), FOUND,
                  # TG_OP, TG_TABLE_NAME, TG_TABLE_SCHEMA, TG_NAME, TG_WHEN,
                  # TG_LEVEL, TG_NARGS, TG_ARGV, TG_RELID, TG_RELNAME,
                  # TG_EVENT, TG_TAG,
                  # SQLSTATE, SQLERRM, ROW_COUNT, PG_CONTEXT,
                  # PG_EXCEPTION_DETAIL, PG_EXCEPTION_HINT, PG_EXCEPTION_CONTEXT,
                  # RETURNED_SQLSTATE, MESSAGE_TEXT, PG_DATATYPE_NAME, PG_ROUTINE_OID
                  # When omitted: NEW/OLD follow keywords.case; TG_*/FOUND are left as-is.

plpgsql_keywords:
  case: upper     # upper | lower | capitalize | preserve
                  # PL/pgSQL-only statement keywords not covered by keywords/reserved_keywords:
                  # RAISE, PERFORM, ELSIF, ELSEIF, FOREACH, REVERSE, SLICE, EXIT, LOOP,
                  # WHILE, OPEN, ASSERT, EXCEPTION (RAISE severity / handler), DEBUG, INFO, NOTICE, WARNING
                  # When omitted: written exactly as they appear in source.

trailing_whitespace: strip   # strip | preserve

semicolons: preserve         # preserve | add | remove
                             #   add:     append ';' if missing
                             #   remove:  strip all ';'

inequality_op: c             # preserve | ansi | c
plpgsql_assignment: preserve # preserve | colon_equals | equals   (PL/pgSQL x := 1 / x = 1 and DECLARE defaults;
                             #   named arguments f(a := 1), comparisons, UPDATE … SET and cursor queries are not touched)
                             #   ansi:    always use <>
                             #   c:       always use !=

join_form: preserve          # preserve | short | long
                             #   short:   JOIN, LEFT JOIN, RIGHT JOIN, FULL JOIN
                             #   long:    INNER JOIN, LEFT OUTER JOIN, RIGHT OUTER JOIN, FULL OUTER JOIN

operator_spacing: normalize  # preserve | normalize | compact
                             #   normalize: exactly one space on each side of =, !=, <>, <, >, <=, >=, ||, :=, =>
                             #   compact:   no spaces around =, !=, <>, <, >, <=, >=, ||, :=, =>

arithmetic_spacing: preserve # preserve | normalize | compact   (default: preserve — leaves spacing untouched)
                             #   normalize: exactly one space around binary + - * / % ^   (a + b, x * 2)
                             #   compact:   no spaces around binary + - * / % ^           (a+b, x*2)
                             #   Only operators that are provably binary are changed; unary signs (x = -1),
                             #   wildcards (SELECT *, count(*), t.*) and %TYPE are never touched.

comma_spacing: normalize     # preserve | normalize | compact
                             #   normalize: one space after comma, none before
                             #   compact:   no spaces around commas

blank_lines: preserve        # preserve | max_3 | max_2 | max_1

blank_lines_between_statements: preserve   # preserve | 0 .. 10
                             #   N: exactly N blank lines between statements (after the ';', and after a
                             #      comment on the same line); comments directly above a statement stay with
                             #      it. psql meta-commands and the text after the last statement are not touched.
statement_break: preserve                 # preserve | always
                             #   always: statements that share a line (select 1; select 2;) start on a line of
                             #           their own; a comment on the line of a ';' stays with its statement,
                             #           blank lines are not touched (blank_lines_between_statements also
                             #           separates them and takes precedence)

line_endings: preserve       # preserve | lf | crlf
                             #   preserve: keep the input's style (CRLF if most line breaks are CRLF)
                             #   lf / crlf: convert — also inside multi-line string literals

comments:
  space_after_marker: preserve   # preserve | add     (--note → -- note; "-----", "--+", "--!" are left alone)
  align_trailing: preserve       # preserve | align | none   (align: trailing -- comments of consecutive lines start in one column;
                                 #                     a single trailing comment is left alone; none: exactly one space before each)

paren_spacing: remove        # preserve | add | remove
call_paren_spacing: preserve # preserve | add | remove  (space between a function name and "(": count (*) vs count(*);
                             #                           only function calls, not IN (...) or VALUES (...))
                             #   add:     space after '(' and before ')'
                             #   remove:  no space after '(' or before ')'

quoted_identifiers: remove_safe  # preserve | remove_safe

schema_qualification: preserve  # preserve | remove_public
                                 #   remove_public: strip "public." prefix from all names

inline_spacing: preserve         # preserve | normalize
                                 #   normalize: collapse 2+ spaces (or a tab) between tokens on the same line
                                 #              to a single space. Only pure-whitespace gaps are
                                 #              affected; newlines, indentation, and inline comments
                                 #              are never touched.
                                 #   Useful for removing hand-aligned column formatting.

syntax_errors: fail          # fail | skip | ignore
                             #   fail:   refuse SQL that does not parse — nothing is written, every bad statement is
                             #           reported as file:line:col and the exit status is 1 (default)
                             #   skip:   format the statements that parse, leave the bad ones exactly as written and
                             #           warn about them (psql meta-commands such as \set are always left as written)
                             #   ignore: token-level formatting without any syntax check (output is only guaranteed
                             #           safe for valid SQL). Override per run with --syntax-errors.

layout:
  line_length: 128              # target line length for auto-break decisions
  indent:
    size: 2                     # number of spaces per indent level (ignored when type: tab)
    type: spaces                # spaces | tab
    normalize: preserve         # preserve | change  (convert existing indentation to configured type)
    remainder: keep             # keep | add | remove | round  (handle leftover spaces when converting to tabs)
  clauses:
    break: preserve             # preserve | never | always | auto
                                #   auto: break all clauses when flat statement length > line_length
    align: same                 # same | indent | right
                                #   indent: places clause keyword one level deeper than SELECT
                                #   right:  "river" — keywords right-aligned on a common edge, content hangs after them
                                #           (use with content.first_item: inline; JOIN lines hang under the FROM content):
                                #             SELECT a.id,
                                #                    a.name
                                #               FROM accounts AS a
                                #              WHERE a.id > 1
                                #           Only broken clauses join the river; each query of a UNION has its own width.
    # per-clause overrides (inherit clauses.break / clauses.align when omitted):
    # into:       { break: auto, align: same }
    # from:       { break: auto, align: same }
    # join:       { break: auto, align: same }
    # where:      { break: auto, align: same }
    # group_by:   { break: auto, align: same }
    # having:     { break: auto, align: same }
    # window:     { break: auto, align: same }   — WINDOW name AS (…) definitions
    # order_by:   { break: auto, align: same }
    # limit:      { break: auto, align: same }
    # offset:     { break: auto, align: same }
    # values:     { break: auto, align: same }
    # on_conflict: { break: auto, align: same }
    # set:        { break: auto, align: same }
    # using:      { break: auto, align: same }
    # returning:  { break: auto, align: same }
    # with:       { break: auto, align: same }
    # exception:  { break: auto, align: same }
    # merge:      { break: auto, align: same }   — MERGE INTO target
    # merge_on:   { break: auto, align: same }   — ON condition of a MERGE
    # when:       { break: auto, align: same }   — WHEN [NOT] MATCHED … THEN action
  union:
    blank_line: preserve        # preserve | none | before | after | both
  content:
    break: preserve             # preserve | never | always | auto
                                #   auto: break content when its flat length > line_length
    align: indent               # same | indent  (indent adds one level inside the clause keyword)
    first_item: break           # break | inline
                                #   break:  first item on a new indented line (default)
                                #           SELECT                  WHERE
                                #              col1,                   cond1
                                #              col2                    AND cond2
                                #   inline: first item on the keyword line, rest indented below
                                #           SELECT col1,            WHERE cond1
                                #              col2                    AND cond2
    align_aliases: preserve     # preserve | align | none   (SELECT list: align pads so every AS lines up, none leaves one space)
    align_set: preserve         # preserve | align | none   (SET list: align pads so every = lines up, none leaves one space)
                                #   both act on lists the layout puts one item per line (first_item: break);
                                #   multi-line items and items with comments or CASE are left alone
    wrap_expressions: preserve  # preserve | wrap   (items longer than line_length: one element per line inside the
                                #   first parenthesised group — function arguments, IN lists, rows; ")" on its own line;
                                #   a window specification OVER (…) gets PARTITION BY / ORDER BY / the frame on a line each.
                                #   Acts on lists the layout puts one item per line; CASE, subqueries and comments are left alone)
    comma_position: preserve    # preserve | end | start   (applies when a list is broken over lines;
                                #   preserve keeps leading commas if the list has them, trailing otherwise)
                                #   end:   a,        start:   a
                                #          b,                , b
                                #          c                 , c      (items stay aligned)
    logical_operator_position: preserve   # preserve | start | end   (AND / OR in broken conditions;
                                #   preserve: end of line if the input ends a line with AND / OR, start otherwise)
                                #   start: a = 1             end:   a = 1 AND
                                #          AND b = 2                b = 2 OR
                                #          OR  c = 3                c = 3
    join_on_position: preserve    # preserve | inline | newline   (ON of a broken JOIN;
                                #   preserve: newline if the input starts a line with ON, inline otherwise)
                                #   inline:  JOIN t ON a = b       newline: JOIN t
                                #            AND c = d                          ON a = b
                                #                                               AND c = d
                                #   JOIN itself is indented under FROM with clauses.join.align: indent.
    # per-section overrides (inherit content.break / content.align / content.first_item when omitted):
    # select_list:    { break: auto, first_item: break }  — SELECT column list (comma-split)
    # where_conds:    { break: auto, first_item: break }  — WHERE conditions (AND/OR split)
    # having_conds:   { break: auto, first_item: break }  — HAVING conditions (AND/OR split)
    # join_on:        { break: auto, first_item: break }  — JOIN ON conditions (AND/OR split)
    # group_list:     { break: auto, first_item: break }  — GROUP BY items (comma-split)
    # order_list:     { break: auto, first_item: break }  — ORDER BY items (comma-split)
    # window_list:    { break: auto, first_item: break }  — WINDOW definitions (comma-split)
    # set_list:       { break: auto, first_item: break }  — UPDATE SET assignments (comma-split)
    # insert_columns: { break: auto, first_item: break }  — INSERT INTO table(col1, col2, …) column list
    # values_list:    { break: auto, first_item: break }  — VALUES row tuples (each tuple is one item)
    # returning_list: { break: auto, first_item: break }  — RETURNING items (comma-split)
    # with_list:      { break: auto, first_item: break }  — WITH CTE definitions (comma-split)
    # merge_on:       { break: auto, first_item: break }  — MERGE ON conditions (AND/OR split)
    # when_actions:   { break: auto }  — MERGE WHEN … THEN: action on its own line below THEN
    #                 (default: never — does NOT inherit content.break)
  case:
    break: preserve              # preserve | never | always | auto
                                 #   never:    collapse CASE...END to single line
                                 #   always:   WHEN/ELSE/END each on own line
                                 #   auto:     expand when flat CASE length > line_length
    indent: indent               # preserve | none | indent
                                 #   indent:   WHEN/ELSE indented one level relative to CASE
                                 #   none:     WHEN/ELSE at same level as CASE
  subquery:
    break: preserve              # preserve | never | always | auto   — (select …), (with …), (values …), CTE bodies
                                 #   never:    join the subquery onto one line
                                 #   always:   "(" stays on its line, the body is laid out one level deeper with the
                                 #             same rules, ")" gets its own line (WHERE/SELECT lists that open a
                                 #             subquery are broken one item per line when content.break is auto)
                                 #   auto:     open only subqueries on a line longer than line_length
                                 #   A subquery containing a -- comment is left as written.
  ddl:
    create_table:
      break: preserve          # preserve | never | always | auto
                               #   always: one column / constraint per line, ")" on its own line
                               #           CREATE TABLE t (
                               #              id bigint NOT NULL,
                               #              note text
                               #           ) WITH (fillfactor = 70);
                               #   never:  collapse to one line (not with a -- comment inside)
                               #   auto:   break when the statement is longer than line_length
      align: preserve          # preserve | none | types | all   (only when the list is broken)
                               #   none:  one space between name, type and constraints
                               #   types: pad names so the types line up
                               #   all:   pad names and types so the constraints line up too
                               #          Table constraints (CONSTRAINT …, PRIMARY KEY (…), …) are not aligned.
    alter_table:
      break: preserve          # preserve | never | always | auto
                               #   always: one action per line below ALTER TABLE name
                               #   auto:   break when there is more than one action or the statement
                               #           is longer than line_length
                               #   (comma_position and indent size apply to both)
      constraints: preserve    # preserve | always | auto   (ADD [CONSTRAINT name] PRIMARY KEY | FOREIGN KEY | UNIQUE | CHECK)
                               #   always: the parts of the constraint each on a line below the action
                               #           ALTER TABLE t
                               #              ADD CONSTRAINT fk
                               #                 FOREIGN KEY (a)
                               #                 REFERENCES u (a)
                               #                 ON DELETE CASCADE;
                               #   auto:   only when the statement is longer than line_length
    create_function:
      params: preserve         # preserve | never | always | auto   (CREATE FUNCTION / PROCEDURE parameter list)
                               #   always: one parameter per line, ")" on its own line
                               #           CREATE FUNCTION f(
                               #              a integer,
                               #              b text
                               #           )
                               #   auto:   break when the header is longer than line_length
      options: preserve        # preserve | never | always | auto   (RETURNS, LANGUAGE, STABLE, SECURITY DEFINER,
                               #   SET …, AS body each on its own line; never: all on one line)
    create_index:
      break: preserve          # preserve | never | always | auto
                               #   always: ON, USING, INCLUDE, WITH (…), TABLESPACE and WHERE each on an indented line
                               #           CREATE INDEX idx
                               #              ON t
                               #              USING btree (a, b)
                               #              WHERE a > 1;
                               #   never:  collapse to one line;  auto: break when longer than line_length
    create_view:
      columns: preserve        # preserve | never | always | auto   (CREATE [MATERIALIZED] VIEW v (a, b, …) AS …)
                               #   always: one column name per line, ")" on its own line
                               #           CREATE VIEW v (
                               #              a,
                               #              b
                               #           ) AS
                               #   never:  one line;  auto: break when the header is longer than line_length
    create_trigger:
      break: preserve          # preserve | never | always | auto   (CREATE [CONSTRAINT | EVENT] TRIGGER)
                               #   always: timing/events, ON, FROM, REFERENCING, FOR EACH, WHEN, [NOT] DEFERRABLE
                               #           and EXECUTE each on an indented line
                               #           CREATE TRIGGER trg
                               #              AFTER INSERT OR UPDATE
                               #              ON t
                               #              FOR EACH ROW
                               #              EXECUTE FUNCTION f();
    create_policy:
      break: preserve          # preserve | never | always | auto   (ON, AS, FOR, TO, USING, WITH CHECK each on a line)
    grant:
      break: preserve          # preserve | never | always | auto   (GRANT and REVOKE: ON, TO / FROM, WITH …, GRANTED BY,
                               #   CASCADE each on a line; the privilege and object lists stay as written)
    create_type:
      break: preserve          # preserve | never | always | auto   (CREATE TYPE … AS ENUM (…) / AS (…): one entry per line)
    create_sequence:
      break: preserve          # preserve | never | always | auto   (CREATE / ALTER SEQUENCE: AS, INCREMENT, MINVALUE,
                               #   MAXVALUE, START, RESTART, CACHE, CYCLE, OWNED BY each on a line)
    create_partition:
      break: preserve          # preserve | never | always | auto   (CREATE TABLE … PARTITION OF: PARTITION OF, FOR VALUES,
                               #   PARTITION BY, WITH, TABLESPACE each on a line)
    drop:
      break: preserve          # preserve | never | always | auto   (DROP TABLE / VIEW / INDEX / … with several objects:
                               #   one per line, CASCADE / RESTRICT on a line of its own; needs more than one object)
    create_domain:
      break: preserve          # preserve | never | always | auto   (DEFAULT, COLLATE, NOT NULL, CONSTRAINT / CHECK each on a line)
    create_extension:
      break: preserve          # preserve | never | always | auto   (WITH SCHEMA, VERSION, CASCADE each on a line)
  dollar_quote:
    newline_after_open: preserve   # preserve | add | remove  (\n after opening $$)
    newline_before_close: preserve # preserve | add | remove  (\n before closing $$)
    sql:
      body_indent: preserve        # preserve | none | indent  (indentation of SQL body lines)
      blank_line_before: preserve  # preserve | add | remove  (blank line after opening $$)
      blank_line_after: preserve   # preserve | add | remove  (blank line before closing $$)
    plpgsql:
      keyword_indent: preserve     # preserve | none | indent  (indent of DECLARE/BEGIN/END keywords)
      declare:
        indent: preserve           # preserve | none | indent  (indentation of DECLARE section body)
        blank_line_before: preserve
        blank_line_after: preserve
      declare_when_empty: preserve # preserve | add | remove  (keep DECLARE section when empty)
      begin_body:
        indent: preserve           # preserve | none | indent  (indentation of BEGIN section body)
        blank_line_before: preserve
        blank_line_after: preserve
      end_semicolon: preserve      # preserve | add | remove  (semicolon after END)
      control_flow:
        if:
          body_indent: preserve        # preserve | none | indent
          blank_line_before: preserve  # preserve | add | remove
          blank_line_after: preserve   # preserve | add | remove
        loop:
          body_indent: preserve
          blank_line_before: preserve
          blank_line_after: preserve
        case:
          simple:                        # CASE expr WHEN val THEN ...
            when_indent: preserve        # preserve | none | indent  (WHEN/ELSE vs CASE level)
            then_break: preserve         # preserve | never | always | auto
                                         #   never:    WHEN val THEN body  (THEN on WHEN line)
                                         #   always:   WHEN val / THEN body (THEN on new line)
                                         #   auto:     same-line if fits, else break before THEN
            then_indent: preserve        # preserve | none | indent  (THEN depth when broken)
            body_break: preserve         # preserve | never | always | auto
                                         #   never:    body starts on THEN line
                                         #   always:   body on new line after THEN
                                         #   auto:     same-line if single-stmt, else new line
            body_indent: preserve        # preserve | none | indent  (body depth when on new line)
            blank_line_before: preserve  # preserve | add | remove  (before WHEN/ELSE/END CASE)
            blank_line_after: preserve   # preserve | add | remove  (blank after THEN/ELSE, body_break: always)
          searched:                      # CASE WHEN cond THEN ...
            when_indent: preserve
            then_break: preserve
            then_indent: preserve
            body_break: preserve
            body_indent: preserve
            blank_line_before: preserve
            blank_line_after: preserve

  paren_indent:
    mode: preserve             # preserve | indent | none
                               #   preserve: don't touch indentation (default)
                               #   indent:   content inside multi-line paren blocks is indented
                               #             by N * indent.size for depth-N blocks; multiple
                               #             unclosed opens on one line → multiple levels
                               #   none:     strip all leading whitespace from content lines
    close_first_on_line: before  # before | after
                               #   before: closing ) starts at the outer (N-1) indent level (default)
                               #   after:  closing ) stays at the inner (N) indent level
    open: preserve             # preserve | own_line
                               #   own_line: a "(" that ends its line moves onto a line of its own, in the
                               #             column of the matching ")" (when that starts its line):
                               #               from (            from
                               #                 select 1   →    (
                               #               ) s                 select 1
                               #                               ) s
                               #             not moved: "(" already first on its line, after a comma or AND / OR,
                               #             or followed by a comment
